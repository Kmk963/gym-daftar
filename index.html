<title>دفتر الجيم</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;700&display=swap">
<style>
/* Layout: one narrow column like a training notebook; sticky tab bar; each exercise is a card of set rows */
:root{
  --bg:#f3f4f2; --card:#ffffff; --fg:#1c1f23; --muted:#646b73; --line:#dde0dc;
  --accent:#1f4fa8; --accent-soft:#e3eaf7; --pr:#b07a00; --pr-soft:#fbf0d2;
  --up:#1d7a46; --down:#b3362c;
  --f-body:"IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-head:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141618; --card:#1d2023; --fg:#e8eaec; --muted:#9aa1a8; --line:#2e3236;
  --accent:#7ea4ee; --accent-soft:#1f2a3d; --pr:#e2b443; --pr-soft:#33290f;
  --up:#5cc58a; --down:#ef7b6f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141618; --card:#1d2023; --fg:#e8eaec; --muted:#9aa1a8; --line:#2e3236;
  --accent:#7ea4ee; --accent-soft:#1f2a3d; --pr:#e2b443; --pr-soft:#33290f;
  --up:#5cc58a; --down:#ef7b6f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-block:12px 150px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
h1{font-family:var(--f-head);font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-family:var(--f-head);font-size:17px;margin:0;text-wrap:balance}
.status{font-size:12px;color:var(--muted)}
.status.err{color:var(--down)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding-block:6px}
nav button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:10px;cursor:pointer}
nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:10px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--card)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
.btn.danger{color:var(--down)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-head);font-weight:500}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.datebar{display:flex;align-items:center;gap:6px}
.datebar .day{flex:1;text-align:center;font-family:var(--f-head);font-weight:500}
.datebar input{font:inherit;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 8px;color:var(--fg)}
.last{font-size:13px;color:var(--muted);background:var(--bg);border-radius:8px;padding:6px 10px}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 32px;gap:6px 8px;align-items:center}
.sets .h{font-size:12px;color:var(--muted)}
.sets .i{color:var(--muted);text-align:center}
.sets input{width:100%;font:inherit;font-family:var(--f-head);font-variant-numeric:tabular-nums;text-align:center;
  border:1px solid var(--line);border-radius:10px;padding:9px 6px;background:var(--bg);color:var(--fg);min-width:0}
.sets input::placeholder{color:var(--muted);opacity:.55}
.sum{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.badge{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--pr-soft);color:var(--pr)}
.empty{text-align:center;color:var(--muted);padding:28px 12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.sheet{display:flex;flex-direction:column;gap:8px}
.sheet input[type=search],.field{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--fg)}
.list{display:flex;flex-direction:column;max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.list button{border:0;border-bottom:1px solid var(--line);background:transparent;text-align:start;padding:10px 12px}
.list button:last-child{border-bottom:0}
.list button:hover{background:var(--accent-soft)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--muted);font-size:12px;text-align:start;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--bg);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 2px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--accent)}
.hl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.hl:last-child{border-bottom:0}
.hl .pct{grid-row:span 2;font-family:var(--f-head);font-weight:700;font-size:24px;color:var(--up);font-variant-numeric:tabular-nums;min-width:72px}
.hl .rank{font-size:12px;color:var(--pr);font-weight:600}
button.chip{border:1px solid var(--line);font-size:12px;padding:3px 10px;cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--card)}
nav button{font-size:13px;padding-inline:2px}
.bar{height:8px;border-radius:999px;background:var(--bg);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.over span{background:var(--down)}
.macro{display:flex;flex-direction:column;gap:4px}
.macro .spread{font-size:13px}
.frow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .nm{flex:1;min-width:0}
.step{display:flex;align-items:center;gap:2px}
.step button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.step span{min-width:32px;text-align:center}
.meal{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.bodyf select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 8px;background:var(--bg);color:var(--fg);width:100%}
.bodyf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bodyf label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.chip{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.up{color:var(--up)} .down{color:var(--down)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--f-head);font-size:20px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--fg);max-width:100%}
svg text{fill:var(--muted);font-size:10px;font-family:var(--f-head)}
textarea{width:100%;min-height:110px;font:12px/1.4 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--fg);direction:ltr}
.hist{display:flex;flex-direction:column}
.hist .item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.hist .item:last-child{border-bottom:0}
.hist .item button.open{border:0;background:transparent;text-align:start;padding:0;flex:1;min-width:0}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}.timer{transition:background .3s}}
.timer{position:fixed;inset:auto 0 0;z-index:6;background:var(--card);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.timer .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.timer .main{display:flex;align-items:center;gap:10px}
.timer .clock{flex:1;display:flex;flex-direction:column;line-height:1.1;min-width:0}
.timer .clock b{font-family:var(--f-head);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.timer.run .clock b{color:var(--accent)}
.timer.done{background:var(--accent-soft)}
.timer.done .clock b{color:var(--up)}
.timer #tgo{min-width:84px;padding-block:10px}
.timer .pre{display:flex;gap:6px}
.timer .pre button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 0;font-size:13px;font-weight:600;color:var(--muted)}
.timer .pre button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
</style>

<div class="wrap" dir="rtl" lang="ar">
  <header>
    <h1>دفتر الجيم</h1>
    <span class="status" id="status">محفوظ على هذا الجهاز</span>
  </header>
  <nav id="tabs">
    <button data-v="log">اليوم</button>
    <button data-v="food">الأكل</button>
    <button data-v="an">التحليل</button>
    <button data-v="prog">الأسبوع</button>
    <button data-v="hist">السجل</button>
    <button data-v="ex">التمارين</button>
  </nav>
  <main id="app"></main>
</div>
<div class="timer" id="timer" dir="rtl" lang="ar" hidden>
  <div class="in">
    <div class="main">
      <div class="clock"><b id="tclock">1:30</b><span class="small muted" id="tlabel">مؤقت الراحة</span></div>
      <button class="btn" data-t="-15" aria-label="نقّص 15 ثانية">−15</button>
      <button class="btn primary" id="tgo">ابدأ</button>
      <button class="btn" data-t="15" aria-label="زيد 15 ثانية">+15</button>
    </div>
    <div class="pre" id="tpre"><button data-p="60">1:00</button><button data-p="90">1:30</button><button data-p="120">2:00</button><button data-p="180">3:00</button><button data-x="auto" id="tauto">تلقائي</button></div>
  </div>
</div>

<script>
const DEFAULT_NAMES=["بنش برس بار","بنش مائل دمبل","تفتيح صدر","ضغط صدر جهاز","سحب أمامي","تجديف بار","تجديف دمبل","عقلة","سكوات","ليغ برس","رفعة رومانية","ديدلفت","رفرفة أرجل","طي أرجل","شولدر برس دمبل","رفرفة جانبية","كتف خلفي","باي بار","باي هامر","تراي حبل","تراي فرنسي","سمانة","بطن"];
const freshState=()=>({exercises:DEFAULT_NAMES.map((n,i)=>({id:"x"+i,name:n})),sessions:{},routines:[],body:{},food:{},foods:[],nut:null});
let S=freshState();
let view="log",curDate=ymd(new Date()),progEx="",weekOff=0,picking=false,pickQ="",armed=null,showBackup=false,anDays=28,plateOpen=null,naming=false,barW=20,fPicking=false,fQ="",fNew=false,planT=0;
const BODY=[["w","الوزن (كغ)"],["waist","الخصر (سم)"],["chest","الصدر (سم)"],["arm","الذراع (سم)"]];
const app=document.getElementById("app");

/* ---------- helpers ---------- */
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseD(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)}
const fDay=new Intl.DateTimeFormat("ar-SY-u-nu-latn",{weekday:"long",day:"numeric",month:"long"});
const fShort=new Intl.DateTimeFormat("ar-SY-u-nu-latn",{day:"numeric",month:"short"});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n1=x=>(Math.round(x*10)/10).toLocaleString("en");
const rid=()=>Math.random().toString(36).slice(2,10);
const sid=date=>"s"+date;
const clone=o=>JSON.parse(JSON.stringify(o));
const valid=e=>e.sets.filter(s=>+s.r>0);
const vol=e=>valid(e).reduce((a,s)=>a+(+s.w||0)*(+s.r),0);
const reps=e=>valid(e).reduce((a,s)=>a+(+s.r),0);
const e1=s=>(+s.w>0&&+s.r>0)?(+s.r===1?+s.w:+s.w*(1+(+s.r)/30)):0;
const best=e=>Math.max(0,...valid(e).map(e1));
const exName=id=>(S.exercises.find(x=>x.id===id)||{name:"تمرين محذوف"}).name;
const sorted=()=>Object.values(S.sessions).sort((a,b)=>a.date<b.date?-1:1);
function history(ex,before){return sorted().filter(s=>!before||s.date<before).flatMap(s=>s.entries.filter(e=>e.ex===ex&&valid(e).length).map(e=>({date:s.date,e})))}
const setsText=e=>valid(e).map(s=>`${+s.w||0}×${+s.r}`).join(" · ");
function weekStart(dateStr){const d=parseD(dateStr);d.setDate(d.getDate()-((d.getDay()+1)%7));return ymd(d)} // weeks start Saturday

/* ---------- storage: account (db) when available, this device otherwise ---------- */
const LS="gym-daftar-v1";
const cloud={db:null,uid:null,chains:{},timers:{}};
function cacheLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function loadLocal(){try{const t=localStorage.getItem(LS);if(t){const o=JSON.parse(t);if(o&&Array.isArray(o.exercises)&&o.sessions)S=Object.assign({routines:[],body:{},food:{},foods:[],nut:null},o)}}catch(e){}}
function status(text,err){const el=document.getElementById("status");el.textContent=text;el.classList.toggle("err",!!err)}
const profRef=()=>cloud.db.doc("data/users/"+cloud.uid+"/profile");
const sessCol=()=>profRef().collection("sessions");
let pending=0;
function chain(key,fn){
  pending++;status("جارٍ الحفظ…");
  const p=(cloud.chains[key]||Promise.resolve()).then(fn).then(()=>{if(--pending===0)status("محفوظ على حسابك")},
    err=>{pending--;status(err&&err.code==="quota_exceeded"?"المساحة امتلأت، احذف جلسات قديمة":"تعذّر الحفظ، تحقق من الاتصال",true)});
  cloud.chains[key]=p.catch(()=>{});
}
function saveSession(id){
  const s=S.sessions[id];
  if(s&&!s.entries.length)delete S.sessions[id];
  cacheLocal();
  if(!cloud.db)return;
  clearTimeout(cloud.timers[id]);
  cloud.timers[id]=setTimeout(()=>{const cur=S.sessions[id];const ref=sessCol().doc(id);chain(id,()=>cur?ref.set(clone(cur)):ref.delete())},700);
}
function saveFood(date){
  if(S.food[date]&&!S.food[date].length)delete S.food[date];
  cacheLocal();if(!cloud.db)return;
  const id="f"+date;clearTimeout(cloud.timers[id]);
  cloud.timers[id]=setTimeout(()=>{const cur=S.food[date];const ref=profRef().collection("food").doc(id);chain(id,()=>cur?ref.set({date,items:clone(cur)}):ref.delete())},700);
}
function saveProfile(){cacheLocal();if(!cloud.db)return;clearTimeout(cloud.timers.p);cloud.timers.p=setTimeout(()=>chain("p",()=>profRef().set({exercises:clone(S.exercises),routines:clone(S.routines),body:clone(S.body),foods:clone(S.foods),nut:S.nut?clone(S.nut):null})),500)}
async function initCloud(){
  if(!window.claude||!window.claude.use){status("محفوظ على هذا الجهاز فقط");return}
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  const id=user?await user.id():null;
  if(!db||!id){status("محفوظ على هذا الجهاز فقط");return}
  cloud.db=db;cloud.uid=id;status("جارٍ تحميل بياناتك…");
  const timeout=new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),10000));
  try{
    const [p,q,fq]=await Promise.race([Promise.all([profRef().get(),sessCol().limit(1000).get(),profRef().collection("food").limit(1000).get()]),timeout]);
    const ns={exercises:null,sessions:{}};
    if(p.exists&&Array.isArray(p.data().exercises))ns.exercises=clone(p.data().exercises);
    q.docs.forEach(d=>{const v=d.data();if(v)ns.sessions[d.id]=clone(v)});
    const cloudEmpty=!ns.exercises&&!q.size&&!fq.size;
    if(cloudEmpty){ // first visit on this account: upload what this device has
      saveProfile();Object.keys(S.sessions).forEach(saveSession);Object.keys(S.food).forEach(saveFood);
    }else{const pd=p.exists?p.data():{};
      S={exercises:ns.exercises||freshState().exercises,sessions:ns.sessions,routines:clone(pd.routines||[]),body:clone(pd.body||{}),
        foods:clone(pd.foods||[]),nut:pd.nut?clone(pd.nut):null,
        food:Object.fromEntries(fq.docs.map(d=>d.data()).filter(v=>v&&v.date).map(v=>[v.date,clone(v.items||[])]))};cacheLocal();render()}
    status("محفوظ على حسابك");
  }catch(e){cloud.db=null;status("ما قدرنا نوصل لحسابك، البيانات محفوظة على هذا الجهاز",true)}
}

/* ---------- coaching helpers ---------- */
// Double progression: work in 8-12 reps; when every set at the top weight hits 12, add 2.5 kg and drop to 8.
const REP_LO=8,REP_HI=12,STEP=2.5;
function suggest(e){
  const v=valid(e);const top=Math.max(...v.map(s=>+s.w||0));
  if(!top)return `<span class="num">${Math.max(...v.map(s=>+s.r))+1}</span> عدات بكل جولة`;
  const minR=Math.min(...v.filter(s=>(+s.w||0)===top).map(s=>+s.r));
  if(minR>=REP_HI)return `<span class="num">${n1(top+STEP)}×${REP_LO}</span> (زيد الوزن)`;
  return `<span class="num">${n1(top)}×${Math.max(minR+1,REP_LO)}</span> بكل الجولات`;
}
function plateSplit(total,bar){
  let side=(total-bar)/2;if(side<-1e-9)return null;const out=[];
  for(const p of [25,20,15,10,5,2.5,1.25])while(side>=p-1e-9){out.push(p);side-=p}
  return {out,rest:Math.round(side*2*100)/100};
}
function plateLine(e,last){
  const ws=e.sets.map(s=>+s.w).filter(w=>w>0);
  const w=ws.length?ws[ws.length-1]:(last?Math.max(0,...valid(last.e).map(s=>+s.w||0)):0);
  if(!w)return `<div class="last">اكتب وزن جولة لنحسب الأقراص.</div>`;
  const r=plateSplit(w,barW);
  return `<div class="last" style="display:flex;flex-direction:column;gap:6px">
    <div class="spread"><span>الوزن <b class="num">${n1(w)}</b> كغ · وزن البار:</span>
      <span class="row" style="gap:4px">${[20,15,10].map(x=>`<button class="chip" data-a="bar" data-n="${x}" aria-pressed="${x===barW}">${x}</button>`).join("")}</span></div>
    <div>${!r?"الوزن أخف من البار.":`كل طرف: <b class="num">${r.out.length?r.out.join(" + "):"البار لحاله"}</b>${r.rest?` <span class="small">(بيضل ${n1(r.rest)} كغ ما بيتقسم)</span>`:""}`}</div></div>`;
}

/* ---------- body view ---------- */
function renderBody(){
  const ds=Object.keys(S.body).sort();const today=ymd(new Date());const t=S.body[today]||{};
  const prev=ds.filter(d=>d<today).pop();const pv=prev?S.body[prev]:{};
  let h=`<section class="card"><h2>وزني ومقاساتي</h2>
    <div class="bodyf">${BODY.map(([k,l])=>`<label>${l}<input class="field num" inputmode="decimal" id="b-${k}" value="${t[k]??""}" placeholder="${pv[k]??""}"></label>`).join("")}</div>
    <button class="btn primary" data-a="saveBody">${S.body[today]?"حدّث قياس اليوم":"احفظ قياس اليوم"}</button>`;
  const wp=ds.filter(d=>S.body[d].w).map(d=>({d,v:S.body[d].w}));
  if(wp.length>=2)h+=lineSvg(wp);
  if(ds.length>=2){

function entrySummary(e){
  const h=history(e.ex,curDate);const prev=Math.max(0,...h.map(x=>best(x.e)));const b=best(e);
  const parts=[];
  if(vol(e))parts.push(`الحجم <span class="num">${n1(vol(e))}</span> كغ`);

  if(b)parts.push(`أقصى تقديري <span class="num">${n1(b)}</span> كغ`);
  let html=parts.join(" · ");
  if(b&&prev&&b>prev+0.01)html+=` <span class="badge">رقم قياسي جديد</span>`;
  else if(b&&h.length&&!prev)html+="";

/* ---------- progress view ---------- */
function weekStats(startStr){
  const end=addDays(startStr,7);const per={};let count=0,total=0;
  sorted().filter(s=>s.date>=startStr&&s.date<end).forEach(s=>{count++;s.entries.forEach(e=>{
    if(!valid(e).length)return;const p=per[e.ex]||(per[e.ex]={vol:0,reps:0,best:0,sets:0});
    p.vol+=vol(e);p.reps+=reps(e);p.sets+=valid(e).length;p.best=Math.max(p.best,best(e));total+=vol(e)})});
  return {per,count,total};
}
function delta(a,b){if(!b||!a)return "";const d=(a-b)/b*100;if(Math.abs(d)<0.5)return `<span class="muted">=</span>`;return `<span class="${d>0?"up":"down"} num">${d>0?"▲":"▼"} ${Math.abs(Math.round(d))}%</span>`}
function chart(ex){
  const pts=history(ex).map(h=>({d:h.date,v:best(h.e)||reps(h.e)}));
  if(pts.length<2)return `<p class="muted small">بدها جلستين على الأقل لهالتمرين لنرسم الخط.</p>`;
  return lineSvg(pts);
}
function lineSvg(pts){
  const W=320,H=150,L=34,R=8,T=10,B=22;
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));if(hi-lo<1){hi+=1;lo-=1}
  const pad=(hi-lo)*0.15;lo=Math.max(0,lo-pad);hi+=pad;
  const x=i=>L+(W-L-R)*i/(pts.length-1),y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const ticks=[lo,(lo+hi)/2,hi];
  const path=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area=`${path}L${x(pts.length-1).toFixed(1)},${H-B}L${L},${H-B}Z`;
  const lp=pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="منحنى التطور" style="direction:ltr">
    ${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L-4}" y="${y(t)+3}" text-anchor="end">${Math.round(t)}</text>`).join("")}
    <path d="${area}" fill="var(--accent-soft)"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?4.5:2.5}" fill="var(--accent)"/>`).join("")}
    <text x="${L}" y="${H-6}" text-anchor="start">${fShort.format(parseD(pts[0].d))}</text>
    <text x="${W-R}" y="${H-6}" text-anchor="end">${fShort.format(parseD(lp.d))}</text>
  </svg>`;
}

      <div class="tile"><b>${ids.filter(i=>a.per[i]&&b.per[i]&&a.per[i].best>b.per[i].best+0.01).length}</b><span>تمارين تحسّن فيها الأقصى</span></div></div>`;
  if(ids.length){

  }else h+=`<p class="muted small">ما في تمارين بهالأسبوع ولا اللي قبله.</p>`;
  h+=`<p class="muted small">الحجم = الوزن × العدات لكل الجولات. الأقصى التقديري = أثقل وزن بتقدر ترفعه مرة وحدة (معادلة Epley)، وبيخليك تقارن 60×10 مع 70×6.</p></section>`;
  const done=S.exercises.filter(x=>history(x.id).length);
  if(!progEx||!done.some(x=>x.id===progEx))progEx=done.length?done[0].id:"";
  h+=`<section class="card"><div class="spread"><h2>منحنى تمرين</h2>${done.length?`<select id="progsel">${done.map(x=>`<option value="${x.id}" ${x.id===progEx?"selected":""}>${esc(x.name)}</option>`).join("")}</select>`:""}</div>`;
  if(progEx){
    const hs=history(progEx);let run=0;
    h+=chart(progEx)+`<div class="tw"><table><thead><tr><th>التاريخ</th><th>الجولات</th><th>أقصى تقديري</th></tr></thead><tbody>

  }else h+=`<p class="muted small">سجّل أول تمرين ليبيّن منحناه هون.</p>`;
  return h+`</section>`;
}

/* ---------- analysis view ---------- */
function analyze(days){
  const today=ymd(new Date());const from=days?addDays(today,-days+1):"0000-00-00";
  const rows=[];let prTotal=0;
  S.exercises.forEach(x=>{
    const all=history(x.id);const inP=all.filter(h=>h.date>=from);if(!inP.length)return;
    const kg=all.some(h=>best(h.e)>0);const m=h=>kg?best(h.e):reps(h.e);
    const before=all.filter(h=>h.date<from);
    const base=before.length?before[before.length-1]:inP[0],now=inP[inP.length-1];
    let run=Math.max(0,...before.map(m)),prs=0;
    inP.forEach((h,i)=>{const v=m(h);if(v>run+0.01&&(run>0||i>0))prs++;run=Math.max(run,v)});
    prTotal+=prs;
    const last3=all.slice(-3),prior=all.slice(0,-3);
    const stalled=all.length>=4&&Math.max(...last3.map(m))<=Math.max(0,...prior.map(m))+0.01;
    const cmp=base!==now&&m(base)>0;
    rows.push({x,kg,from:m(base),to:m(now),fromD:base.date,pct:cmp?(m(now)-m(base))/m(base)*100:null,n:inP.length,prs,stalled,
      vol:inP.reduce((a,h)=>a+vol(h.e),0)});
  });
  return {rows,prTotal,from};
}
function volBars(from){
  const today=ymd(new Date());let ws=weekStart(from<"2000"?(sorted()[0]||{date:today}).date:from);const cur=weekStart(today);
  const weeks=[];while(ws<=cur){weeks.push({s:ws,v:weekStats(ws).total});ws=addDays(ws,7)}
  const W=weeks.slice(-12);if(W.length<2)return "";
  const mx=Math.max(1,...W.map(w=>w.v)),w=320,h=120,B=18,bw=(w-8)/W.length;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="الحجم الأسبوعي" style="direction:ltr">
    <line x1="0" x2="${w}" y1="${h-B}" y2="${h-B}" stroke="var(--line)"/>
    ${W.map((x,i)=>{const bh=(h-B-14)*x.v/mx;return `<rect x="${4+i*bw+bw*0.15}" y="${h-B-bh}" width="${bw*0.7}" height="${bh}" rx="3" fill="${i===W.length-1?"var(--accent)":"var(--accent-soft)"}"/>`}).join("")}
    <text x="4" y="${h-4}" text-anchor="start">${fShort.format(parseD(W[0].s))}</text>
    <text x="${w-4}" y="${h-4}" text-anchor="end">هالأسبوع</text>
    <text x="${w-4}" y="10" text-anchor="end">${n1(mx)} كغ</text></svg>`;
}
const pctTxt=p=>p===null?"—":`<span class="${p>0.5?"up":p<-0.5?"down":"muted"} num">${p>0?"+":""}${Math.round(p)}%</span>`;
const valTxt=(v,kg)=>kg?n1(v)+" كغ":v+" عدة";

  return h;

  if(f.u)return `${qTxt(q)} ${q>1?PLURAL[f.u]:f.u}${g?` (${g}${unit})`:""}`;

// Mifflin-St Jeor for resting burn, times activity; or the measured burn if the user adopted it.
function targets(){
  const n=S.nut,w=latestWeight();if(!n||!w||!n.age||!n.h)return null;
  const bmr=10*w+6.25*n.h-5*n.age+(n.sex==="f"?-161:5);const tdee=bmr*n.act;const g=GOALS[n.goal]||GOALS.keep;
  const base=n.tdee||tdee;const kcal=Math.round(base*(1+g[1])/10)*10;
  // Protein and fat use a reference weight (BMI 25 for your height) when you're above it: extra kilos are mostly fat, not muscle.
  const pw=Math.round(Math.min(w,25*(n.h/100)**2));
  const p=Math.round(pw*g[2]),f=Math.round(pw*0.8),c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
  return {bmr,tdee,base,kcal,p,c,f,w,pw,perKg:g[2],measured:!!n.tdee};

// Measured burn: average logged intake minus the energy in the weight change (≈7700 kcal per kg), over the last 3 weeks.
function measuredBurn(){
  const today=ymd(new Date()),from=addDays(today,-20);
  const days=Object.keys(S.food).filter(d=>d>=from&&d<today&&S.food[d].length);
  const ws=Object.keys(S.body).filter(d=>d>=from&&S.body[d].w).sort();
  const span=ws.length>=2?(parseD(ws[ws.length-1])-parseD(ws[0]))/864e5:0;
  if(days.length<10||ws.length<2||span<10)return {need:true,days:days.length,ws:ws.length};
  const avgIn=days.reduce((a,d)=>a+dayTotals(d).k,0)/days.length;
  const xs=ws.map(d=>(parseD(d)-parseD(ws[0]))/864e5),ys=ws.map(d=>S.body[d].w);
  const mx=xs.reduce((a,b)=>a+b)/xs.length,my=ys.reduce((a,b)=>a+b)/ys.length;
  const slope=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/xs.reduce((a,x)=>a+(x-mx)**2,0);
  return {tdee:Math.round((avgIn-slope*7700)/10)*10,avgIn,perWeek:slope*7,days:days.length};
}
const PLANS=[

const roundTo=(x,st)=>Math.max(st,Math.round(x/st)*st);
// Scale protein foods to reach the protein target, then carb foods to reach the calories.
function buildPlan(t,tg){
  const items=PLANS[t].meals.flatMap((m,mi)=>m[1].map(([id,q,r])=>({mi,id,q,r})));
  const sum=(arr,key)=>arr.reduce((a,i)=>a+foodById(i.id)[key]*i.q,0);
  const P=items.filter(i=>i.r==="p"),C=items.filter(i=>i.r==="c");
  const fp=Math.min(2.5,Math.max(0.5,(tg.p-sum(items.filter(i=>i.r!=="p"),"p"))/sum(P,"p")));
  P.forEach(i=>i.q=roundTo(i.q*fp,foodById(i.id).st));
  const fc=Math.min(3,Math.max(0.5,(tg.kcal-sum(items.filter(i=>i.r!=="c"),"k"))/sum(C,"k")));
  C.forEach(i=>i.q=roundTo(i.q*fc,foodById(i.id).st));
  // Rounding leaves a gap: nudge carb portions one step at a time until within ~100 kcal.
  for(let n=0;n<20;n++){
    const diff=tg.kcal-sum(items,"k");if(Math.abs(diff)<100)break;
    const cand=C.filter(i=>{const f=foodById(i.id);return f.k*f.st<=Math.abs(diff)+60&&(diff>0||i.q>f.st)})
      .sort((a,b)=>foodById(b.id).k*foodById(b.id).st-foodById(a.id).k*foodById(a.id).st);
    if(!cand.length)break;const it=cand[n%cand.length];it.q+=Math.sign(diff)*foodById(it.id).st;
  }
  // Still over a low target: trim side dishes, biggest first, dropping them if needed.
  for(let n=0;n<20;n++){
    const diff=tg.kcal-sum(items,"k");if(diff>-100)break;
    const it=items.filter(i=>i.r==="x"&&i.q>0).sort((a,b)=>foodById(b.id).k*b.q-foodById(a.id).k*a.q)[0];
    if(!it)break;it.q=Math.max(0,it.q-0.5);
  }
  return items.filter(i=>i.q>0);
}

// Auto rest: once reps are typed for a set, start the rest after a short pause (each set only once).
function autoRest(key){

  T.autoT=setTimeout(()=>{if(!T.done.has(key)){T.done.add(key);tStart()}},1500);
}
const tEl=document.getElementById("timer"),tClock=document.getElementById("tclock"),tGo=document.getElementById("tgo"),tLabel=document.getElementById("tlabel");
const fmtT=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function tSave(){try{localStorage.setItem("gym-rest",String(T.dur))}catch(e){}}
function tDraw(){
  tClock.textContent=fmtT(T.end?(T.end-Date.now())/1000:T.dur);
  tGo.textContent=T.end?"إيقاف":"ابدأ";tEl.classList.toggle("run",!!T.end);
  if(T.end)tLabel.textContent="الراحة شغالة";
  document.querySelectorAll("#tpre [data-p]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.p===T.dur));
  document.getElementById("tauto").setAttribute("aria-pressed",T.auto);
}
// Alarm: 3 long beeps, played twice; the phone vibrates for exactly the length of each beep so sound and buzz land together.
const BEEP=0.6,GAP=0.3,ROUND_GAP=0.9,ROUNDS=2;
function beep(){
  const starts=[];for(let r=0;r<ROUNDS;r++)for(let i=0;i<3;i++)starts.push(r*(3*BEEP+2*GAP+ROUND_GAP)+i*(BEEP+GAP));
  try{const c=T.ctx;if(c){const t0=c.currentTime+0.05;
    starts.forEach(dt=>{const o=c.createOscillator(),g=c.createGain();o.type="square";o.frequency.value=988;
      g.gain.setValueAtTime(0.0001,t0+dt);g.gain.exponentialRampToValueAtTime(0.45,t0+dt+0.02);
      g.gain.setValueAtTime(0.45,t0+dt+BEEP-0.05);g.gain.exponentialRampToValueAtTime(0.0001,t0+dt+BEEP);
      o.connect(g).connect(c.destination);o.start(t0+dt);o.stop(t0+dt+BEEP+0.02)})}}catch(e){}
  try{if(navigator.vibrate){const p=[];starts.forEach((s,i)=>{if(i)p.push(Math.round((s-starts[i-1]-BEEP)*1000));p.push(BEEP*1000)});navigator.vibrate(p)}}catch(e){}
}
async function wake(on){
  try{if(on&&!T.lock&&navigator.wakeLock){T.lock=await navigator.wakeLock.request("screen");T.lock.addEventListener("release",()=>T.lock=null)}
    else if(!on&&T.lock){await T.lock.release();T.lock=null}}catch(e){}
}
function tStart(){
  ensureAudio();
  tEl.classList.remove("done");T.end=Date.now()+T.dur*1000;clearInterval(T.iv);T.iv=setInterval(tTick,250);wake(true);tDraw();
}
function tStop(label){T.end=0;clearInterval(T.iv);wake(false);tLabel.textContent=label||"مؤقت الراحة";tDraw()}
function tTick(){
  if(T.end&&Date.now()>=T.end){tStop("خلصت الراحة، يلا الجولة الجاية");tEl.classList.add("done");beep();setTimeout(()=>tEl.classList.remove("done"),5000)}
  else tDraw();
}
tGo.addEventListener("click",()=>T.end?tStop():tStart());
tEl.addEventListener("click",e=>{
  const b=e.target.closest("[data-t],[data-p],[data-x]");if(!b)return;
  if(b.dataset.x==="auto"){T.auto=!T.auto;try{localStorage.setItem("gym-auto",T.auto?"1":"0")}catch(err){}tDraw();return}
  if(b.dataset.p){T.dur=+b.dataset.p;tSave();if(T.end)tStart();else tDraw();return}
  const d=+b.dataset.t;
  if(T.end){T.end=Math.max(Date.now()+1000,T.end+d*1000);tDraw()}
  else{T.dur=Math.max(15,Math.min(600,T.dur+d));tSave();tDraw()}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&T.end){wake(true);tTick()}});
tDraw();

function render(){
  tEl.hidden=view!=="log";
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.v===view));
  app.innerHTML=`<div style="display:flex;flex-direction:column;gap:14px">${view==="log"?renderLog():view==="food"?renderFood():view==="an"?renderAn()+renderBody():view==="prog"?renderProg():view==="hist"?renderHist():renderEx()}</div>`;
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(b){view=b.dataset.v;armed=null;picking=false;render();scrollTo(0,0)}});
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,ei=+b.dataset.e,si=+b.dataset.s;
  const s=curSession(false);
  if(a!=="rmEntry"&&a!=="delEx"&&a!=="delRoutine")armed=null;
  if(a==="day"){curDate=addDays(curDate,+b.dataset.n);picking=false;plateOpen=null;naming=false}
  else if(a==="startRoutine"){const r=S.routines.find(x=>x.id===b.dataset.id);const ss=curSession(true);
    r.exs.filter(ex=>S.exercises.some(x=>x.id===ex)).forEach(ex=>{const l=history(ex,curDate).pop();const n=l?valid(l.e).length:3;
      ss.entries.push({ex,sets:Array.from({length:n||3},()=>({w:"",r:""}))})});saveSession(ss.id)}
  else if(a==="nameRoutine"){naming=true;render();document.getElementById("rtname").focus();return}
  else if(a==="cancelName")naming=false;
  else if(a==="saveRoutine"){const v=document.getElementById("rtname").value.trim();if(!v)return;
    S.routines.push({id:"r"+rid(),name:v,exs:[...new Set(s.entries.map(e=>e.ex))]});naming=false;saveProfile()}
  else if(a==="delRoutine"){const id=b.dataset.id;if(armed!=="r"+id)armed="r"+id;else{armed=null;S.routines=S.routines.filter(x=>x.id!==id);saveProfile()}}
  else if(a==="plates")plateOpen=plateOpen===ei?null:ei;
  else if(a==="bar"){barW=+b.dataset.n;try{localStorage.setItem("gym-bar",String(barW))}catch(err){}}
  else if(a==="saveBody"){const today=ymd(new Date());const o={};
    BODY.forEach(([k])=>{const v=parseFloat(document.getElementById("b-"+k).value.replace(",","."));if(v>0)o[k]=v});
    if(Object.keys(o).length)S.body[today]=o;else delete S.body[today];saveProfile()}
  else if(a==="fOpen"){fPicking=true;fQ="";fNew=false;render();document.getElementById("fq").focus();return}
  else if(a==="fClose"){fPicking=false;fNew=false}
  else if(a==="fPick"){(S.food[curDate]=S.food[curDate]||[]).push({id:b.dataset.id,q:1});fPicking=false;saveFood(curDate)}
  else if(a==="fNew")fNew=true;
  else if(a==="fSaveNew"){const g=k=>document.getElementById("fn-"+k).value.trim();const num=k=>Math.max(0,parseFloat(g(k).replace(",","."))||0);
    if(!g("n")||!num("k"))return;const f={id:"c"+rid(),n:g("n"),s:g("s")||"حصة",g:num("g"),k:num("k"),p:num("p"),c:num("c"),f:num("f"),st:0.5};
    S.foods.push(f);saveProfile();(S.food[curDate]=S.food[curDate]||[]).push({id:f.id,q:1});fPicking=false;fNew=false;saveFood(curDate)}
  else if(a==="fQty"){const it=S.food[curDate][+b.dataset.i];const st=foodById(it.id).st;it.q=Math.round((it.q+ +b.dataset.n*st)*10)/10;
    if(it.q<=0)S.food[curDate].splice(+b.dataset.i,1);saveFood(curDate)}
  else if(a==="planT")planT=+b.dataset.n;
  else if(a==="planLog"){const tg=targets();if(!tg)return;const arr=S.food[curDate]=S.food[curDate]||[];
    buildPlan(planT,tg).filter(i=>i.mi===+b.dataset.m).forEach(i=>{const ex=arr.find(x=>x.id===i.id);if(ex)ex.q+=i.q;else arr.push({id:i.id,q:i.q})});saveFood(curDate)}
  else if(a==="nutSave"){const v=id=>document.getElementById(id).value;const w=parseFloat(v("n-w").replace(",","."));
    S.nut=Object.assign(S.nut||{},{sex:v("n-sex"),age:+v("n-age")||0,h:+v("n-h")||0,act:+v("n-act"),goal:v("n-goal")});
    if(w>0&&w!==latestWeight()){const t=ymd(new Date());S.body[t]=Object.assign(S.body[t]||{},{w})}saveProfile()}
  else if(a==="adopt"){S.nut.tdee=+b.dataset.n||0;if(!S.nut.tdee)delete S.nut.tdee;saveProfile()}
  else if(a==="openPick"){picking=true;pickQ="";render();document.getElementById("pickq").focus();return}
  else if(a==="closePick")picking=false;
  else if(a==="pick"||a==="newEx"){
    let id=b.dataset.id;
    if(a==="newEx"){id="x"+rid();S.exercises.push({id,name:pickQ.trim()});saveProfile()}
    const ss=curSession(true);ss.entries.push({ex:id,sets:[{w:"",r:""}]});picking=false;saveSession(ss.id);
    render();const ix=ss.entries.length-1;const inp=document.getElementById(`w-${ix}-0`);if(inp){inp.scrollIntoView({block:"center"});inp.focus()}return}
  else if(a==="addSet"){const en=s.entries[ei];const l=en.sets[en.sets.length-1];en.sets.push({w:l?l.w:"",r:l?l.r:""});saveSession(s.id)}
  else if(a==="rmSet"){s.entries[ei].sets.splice(si,1);if(!s.entries[ei].sets.length)s.entries[ei].sets.push({w:"",r:""});saveSession(s.id)}
  else if(a==="rmEntry"){if(armed!=="e"+ei){armed="e"+ei}else{armed=null;s.entries.splice(ei,1);saveSession(s.id)}}
  else if(a==="copyFrom"){const src=S.sessions[b.dataset.id];const ss=curSession(true);
    src.entries.forEach(en=>ss.entries.push({ex:en.ex,sets:en.sets.map(()=>({w:"",r:""}))}));saveSession(ss.id)}
  else if(a==="period")anDays=+b.dataset.n;
  else if(a==="week")weekOff=Math.min(0,weekOff+ +b.dataset.n);
  else if(a==="openDay"){curDate=b.dataset.d;view="log"}
  else if(a==="addEx"){const v=document.getElementById("newname").value.trim();if(!v||S.exercises.some(x=>x.name===v))return;S.exercises.push({id:"x"+rid(),name:v});saveProfile()}
  else if(a==="delEx"){const id=b.dataset.id;if(armed!=="x"+id)armed="x"+id;else{armed=null;S.exercises=S.exercises.filter(x=>x.id!==id);saveProfile()}}
  else if(a==="toggleImport")showBackup=!showBackup;
  else if(a==="exportCopy"){const t=JSON.stringify(S);const m=document.getElementById("bkmsg");
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent="انتسخت. الصقها بملاحظاتك أو ابعتها لحالك.",
      ()=>{showBackup=true;render();const ta=document.getElementById("importtxt");ta.value=t;ta.select();document.getElementById("bkmsg").textContent="النسخ التلقائي ما اشتغل؛ النص محدد، انسخه يدوياً."});return}
  else if(a==="doImport"){const m=document.getElementById("bkmsg");
    try{const o=JSON.parse(document.getElementById("importtxt").value);if(!o||!Array.isArray(o.exercises)||!o.sessions)throw 0;
      o.exercises.forEach(x=>{if(!S.exercises.some(y=>y.id===x.id))S.exercises.push(x)});
      (o.routines||[]).forEach(r=>{if(!S.routines.some(y=>y.id===r.id))S.routines.push(r)});
      S.body=Object.assign({},o.body||{},S.body);
      (o.foods||[]).forEach(f=>{if(!S.foods.some(y=>y.id===f.id))S.foods.push(f)});
      if(!S.nut&&o.nut)S.nut=o.nut;
      Object.entries(o.food||{}).forEach(([d,v])=>{if(!S.food[d]){S.food[d]=v;saveFood(d)}});
      Object.values(o.sessions).forEach(x=>{if(!S.sessions[x.id]){S.sessions[x.id]=x;saveSession(x.id)}});
      saveProfile();showBackup=false;render();document.getElementById("bkmsg").textContent="تم الاسترجاع.";}
    catch(err){m.textContent="النص مش نسخة احتياطية صحيحة من دفتر الجيم."}return}
  render();
});
app.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="pickq"||t.id==="fq"){if(t.id==="fq")fQ=t.value;else pickQ=t.value;const pos=t.selectionStart;render();const n=document.getElementById(t.id);n.focus();n.setSelectionRange(pos,pos);return}
  if(t.dataset.f){const s=curSession(false);const v=t.value.replace(",",".").replace(/[^\d.]/g,"");if(v!==t.value)t.value=v;
    s.entries[+t.dataset.e].sets[+t.dataset.s][t.dataset.f]=v;saveSession(s.id);
    if(t.dataset.f==="r"&&+v>0)autoRest(s.id+"/"+t.dataset.e+"/"+t.dataset.s);
    document.getElementById("sum-"+t.dataset.e).innerHTML=entrySummary(s.entries[+t.dataset.e]);}
});
app.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="datepick"&&t.value){curDate=t.value;picking=false;render()}
  else if(t.id==="progsel"){progEx=t.value;render()}
  else if(t.dataset.rename){const v=t.value.trim();const x=S.exercises.find(y=>y.id===t.dataset.rename);if(x&&v&&v!==x.name){x.name=v;saveProfile()}else if(x)t.value=x.name}
});
app.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="pickq"){const f=document.querySelector("#picklist button");if(f)f.click()}
  if(e.key==="Enter"&&e.target.id==="fq"){const f=document.querySelector("#flist button");if(f)f.click()}
  if(e.key==="Enter"&&e.target.id==="newname")document.querySelector('[data-a="addEx"]').click();
});

loadLocal();render();initCloud();
</script>
